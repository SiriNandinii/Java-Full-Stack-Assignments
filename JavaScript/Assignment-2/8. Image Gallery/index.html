<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
</head>
<body>

    <h2>Image Gallery</h2>

    <img src="image1.jpg" width="150" title="Image 1"
        onmouseover="zoom(this)"
        onmouseout="normal(this)"
        onclick="preview(this)">

    <img src="image2.jpg" width="150" title="Image 2"
        onmouseover="zoom(this)"
        onmouseout="normal(this)"
        onclick="preview(this)">

    <img src="image3.jpg" width="150" title="Image 3"
        onmouseover="zoom(this)"
        onmouseout="normal(this)"
        onclick="preview(this)">

    <img src="image4.jpg" width="150" title="Image 4"
        onmouseover="zoom(this)"
        onmouseout="normal(this)"
        onclick="preview(this)">

    <h3 id="title"></h3>

    <img id="preview" width="400">

    <script src="script.js"></script>

</body>
</html>
