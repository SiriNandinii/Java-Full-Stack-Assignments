<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback Form</title>
</head>
<body>

    <h2>Customer Feedback Form</h2>

    <form onsubmit="displayFeedback(); return false;">

        Name:
        <input type="text" id="name"><br><br>

        Email:
        <input type="email" id="email"><br><br>

        Rating:
        <select id="rating">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
        </select><br><br>

        Suggestions:<br>
        <textarea id="suggestions"></textarea><br><br>

        Department:
        <select id="department">
            <option>Sales</option>
            <option>Support</option>
            <option>Technical</option>
        </select><br><br>

        <input type="checkbox" id="subscribe">
        Subscribe to Newsletter
        <br><br>

        <input type="submit" value="Submit">

    </form>

    <br>

    <table border="1" cellpadding="10">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Rating</th>
            <th>Suggestions</th>
            <th>Department</th>
            <th>Subscribed</th>
        </tr>

        <tbody id="tableBody"></tbody>

    </table>

    <script src="script.js"></script>

</body>
</html>
